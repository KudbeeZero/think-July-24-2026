build:
  docker:
    web: Dockerfile
    agent-mayor: Dockerfile
    agent-toast: Dockerfile
    agent-refinery: Dockerfile
run:
  web: ./run.sh
  agent-mayor: node dist/server.cjs --agent=mayor
  agent-toast: node dist/server.cjs --agent=toast
  agent-refinery: node dist/server.cjs --agent=refinery
